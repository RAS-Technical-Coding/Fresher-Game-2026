<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>IEEE RAS // JOYSTICK CONTROLLER</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
:root{--void:#090909;--white:#f7f9fa;--soft:#f0f0f0;--steel:#828384;--graphite:#474747;--iron:#423738;--ash:#6b6b6b;--violet:#af50ff;--line:rgba(247,249,250,.16);--mono:'DM Mono',ui-monospace,monospace;--sans:'DM Sans',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--void);color:var(--white);font-family:var(--sans);touch-action:manipulation}
body{min-height:100vh}
.app{width:min(100%,560px);min-height:100vh;margin:0 auto;padding:18px 20px max(20px,env(safe-area-inset-bottom));display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 0 17px;border-bottom:1px solid var(--line)}
.brand{font:500 12px/1.7 var(--mono);letter-spacing:.14em;color:var(--soft)}.brand span{color:var(--white)}
.link{font:10px var(--mono);letter-spacing:.12em;color:var(--steel);text-align:right}.link i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--steel);margin:0 7px 1px 0}.link.online i{background:var(--violet)}
.timer{font:500 18px var(--mono);color:var(--white);text-align:right;margin-top:7px;letter-spacing:.04em}
.mission{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0 18px;font:10px var(--mono);letter-spacing:.1em;color:var(--steel)}.mission #message{color:var(--soft)}
.clear{border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--steel);font:10px var(--mono);letter-spacing:.08em;padding:8px 11px}
.deck{display:flex;flex-direction:column;gap:0}.control-title{display:flex;justify-content:space-between;color:var(--soft);font:11px var(--mono);letter-spacing:.18em;margin:7px 0 15px}
.control-panel{width:100%;margin:0 0 14px}.control-section{padding:15px 0;border-top:1px solid var(--line);margin:0}.section-label{font:10px var(--mono);letter-spacing:.18em;color:var(--steel);margin-bottom:12px}
.angle-grid,.forward-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.angle-option,.forward-option{min-height:46px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--soft);font:12px var(--mono);touch-action:manipulation;transition:background .15s,border-color .15s,color .15s}
.angle-option.selected,.forward-option.selected{border-color:var(--violet);background:var(--violet);color:#fff}
.selected-info{margin-top:10px;color:var(--steel);font:10px var(--mono);letter-spacing:.06em;text-align:right}.selected-info strong{color:var(--white);font-weight:500}
.range-note{margin-top:10px;color:var(--ash);font:9px var(--mono);letter-spacing:.09em;text-align:left}
.add-move{width:100%;min-height:50px;border:1px solid var(--violet);border-radius:8px;background:var(--violet);color:#fff;font:500 11px var(--mono);letter-spacing:.12em;touch-action:manipulation}.add-move:active{opacity:.82;transform:translateY(1px)}
.readouts{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:0 0 14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.readout{padding:13px 10px 13px 0;text-align:left}.readout+ .readout{padding-left:15px;border-left:1px solid var(--line)}.readout b{display:block;color:var(--steel);font:9px var(--mono);letter-spacing:.16em;margin-bottom:7px}.readout span{color:var(--white);font:13px var(--mono)}
.turns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:0}.btn{min-height:50px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--soft);font:10px var(--mono);letter-spacing:.08em}.btn:active,.btn.pressed{border-color:var(--white);background:rgba(247,249,250,.08)}.grab{color:var(--soft)}.drop{color:var(--soft)}
.exec{width:100%;min-height:54px;margin-top:10px;border:1px solid var(--white);border-radius:8px;color:var(--white);font:500 11px var(--mono);letter-spacing:.12em;background:transparent}.exec:active{background:rgba(247,249,250,.1)}
.queue-title{display:flex;justify-content:space-between;margin-top:20px;padding-top:13px;border-top:1px solid var(--line);color:var(--steel);font:10px var(--mono);letter-spacing:.13em}.queue{min-height:54px;max-height:108px;margin-top:9px;display:flex;gap:7px;overflow:auto;padding:8px 0;border-bottom:1px solid var(--line);background:transparent}.queue>span{color:var(--ash);font:10px var(--mono);letter-spacing:.03em;padding:10px 0}.chip{flex:0 0 auto;padding:9px 10px;border:1px solid var(--line);border-radius:6px;color:var(--soft);font:10px var(--mono);background:transparent}.status-line{margin-top:11px;text-align:left;color:var(--steel);font:10px var(--mono);letter-spacing:.08em;min-height:14px}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:left;background:rgba(9,9,9,.96);z-index:30;padding:24px}.overlay.show{display:flex}.modal{width:min(100%,390px);border:1px solid var(--line);border-radius:19px;padding:30px 24px;background:#111}.modal h1{font:italic 500 32px/1.1 'Playfair Display',Georgia,serif;color:var(--white)}.modal p{color:var(--steel);font:14px/1.6 var(--sans)}
button{cursor:pointer}button:disabled{opacity:.42;cursor:default}
@media(max-width:360px){.app{padding-left:15px;padding-right:15px}.angle-grid,.forward-grid{gap:6px}.angle-option,.forward-option{min-height:42px;font-size:11px}}
</style>
<style>
:root{--void:#050510;--panel:#09091c;--white:#fff7d6;--muted:#aaa5c5;--yellow:#ffe500;--cyan:#31e8ff;--pink:#ff4aa2;--red:#ff4a55;--line:#4542a2;--mono:'VT323',Consolas,monospace;--pixel:'Press Start 2P',monospace}
html,body{background-color:var(--void);background-image:radial-gradient(rgba(49,232,255,.12) 1px,transparent 1px);background-size:18px 18px;color:var(--white);font-family:var(--mono)}
.app{width:min(100%,560px);padding:14px 18px max(18px,env(safe-area-inset-bottom));background:rgba(5,5,16,.96);border-left:2px solid var(--line);border-right:2px solid var(--line);box-shadow:0 0 0 5px #08081a}
header{padding:13px 12px;border:2px solid var(--cyan);background:var(--panel);box-shadow:inset 0 0 0 3px #09091c,0 0 14px rgba(49,232,255,.13)}
.brand{font:9px/1.8 var(--pixel);color:var(--white)}.brand span{color:var(--yellow)}.link{font:16px var(--mono);color:var(--muted)}.link i{width:8px;height:8px}.link.online i{background:#44ff80;box-shadow:0 0 9px #44ff80}.timer{font:16px var(--pixel);color:var(--yellow);text-shadow:0 0 8px rgba(255,229,0,.35)}
.mission{font:17px var(--mono);color:var(--cyan);text-transform:uppercase}.mission #message{color:var(--yellow)}.clear{border:1px solid var(--pink);background:#160b20;color:var(--pink);font:9px var(--pixel);padding:9px}
.control-title{color:var(--yellow);font:9px/1.8 var(--pixel);text-shadow:0 0 10px rgba(255,229,0,.22)}.control-panel{padding:0 10px;border:2px dashed var(--line);background:rgba(9,9,28,.9)}.control-section{padding:13px 0;border-bottom:1px dashed #38356e}.section-label{font:9px var(--pixel);color:var(--cyan)}
.angle-grid,.forward-grid{gap:7px}.angle-option,.forward-option{min-height:43px;border:2px solid #38356e;background:#0c0c22;color:var(--white);font:18px var(--mono);box-shadow:inset 0 -3px #050510}.angle-option.selected,.forward-option.selected{border-color:var(--yellow);background:#24200a;color:var(--yellow);box-shadow:0 0 10px rgba(255,229,0,.22),inset 0 -3px #6f6100}
.selected-info{color:var(--muted);font:15px var(--mono)}.selected-info strong{color:var(--yellow)}.range-note{color:var(--muted);font:14px var(--mono)}
.add-move{min-height:50px;border:2px solid var(--yellow);background:var(--yellow);color:#171300;font:9px var(--pixel);box-shadow:0 4px #9b8500,0 0 14px rgba(255,229,0,.18)}
.readouts{gap:8px}.readout{padding:10px;border:1px solid var(--line);background:var(--panel)}.readout b{color:var(--cyan);font:8px var(--pixel)}.readout span{color:var(--yellow);font:20px var(--mono)}
.turns{gap:8px}.btn{min-height:48px;border:2px solid var(--pink);background:#170b20;color:#ff9bc9;font:9px/1.6 var(--pixel)}.btn.drop{border-color:var(--cyan);background:#071720;color:var(--cyan)}.exec{min-height:56px;border:2px solid var(--red);background:#260b15;color:#ff7d84;font:9px/1.8 var(--pixel);box-shadow:0 0 13px rgba(255,74,85,.15)}
.queue-title{border-bottom:1px dashed var(--line);color:var(--cyan);font:8px/1.6 var(--pixel)}.queue{background:var(--panel)}.queue>span{color:var(--muted);font:17px var(--mono)}.chip{border:1px solid var(--cyan);background:#071720;color:var(--cyan);font:16px var(--mono)}.status-line{color:var(--yellow);font:16px var(--mono);text-transform:uppercase}
.overlay{background:rgba(4,4,16,.96)}.modal{border:3px solid var(--yellow);background:#0b0b20;box-shadow:0 0 0 5px #10102b,0 0 28px rgba(255,229,0,.2)}.modal h1{font:13px/1.8 var(--pixel);color:var(--yellow)}.modal p{color:var(--white);font:21px/1.35 var(--mono)}button:disabled{opacity:.4}
@media(max-width:360px){.angle-option,.forward-option{min-height:39px}.brand{font-size:8px}.control-title,.section-label,.readout b,.exec,.add-move,.btn,.queue-title{font-size:8px}}
</style>
</head>
<body>
<div class="app">
<header>
    <div class="brand"><span>IEEE RAS</span><br>ROBOT RUN</div>
    <div>
        <div class="link" id="link"><i></i><span id="linkText">CONNECTING</span></div>
        <div class="timer" id="timer">02:00</div>
    </div>
</header>

<div class="mission">
    <span id="message">WAITING FOR MISSION...</span>
    <button class="clear" id="clear" type="button">CLEAR</button>
</div>

<main class="deck">
<div class="control-title">
        <span>PROGRAM YOUR ROUTE</span>
</div>

    <div class="control-panel">
    <div class="control-section">
        <div class="section-label">ANGLE</div>
        <div class="angle-grid" id="angleGrid">
            <button class="angle-option selected" data-angle="0">0°</button>
            <button class="angle-option" data-angle="45">45°</button>
            <button class="angle-option" data-angle="90">90°</button>
            <button class="angle-option" data-angle="135">135°</button>
            <button class="angle-option" data-angle="180">180°</button>
            <button class="angle-option" data-angle="225">225°</button>
            <button class="angle-option" data-angle="270">270°</button>
            <button class="angle-option" data-angle="315">315°</button>
        </div>
        <div class="selected-info">SELECTED ANGLE: <strong id="selectedAngle">0°</strong></div>
    </div>

    <div class="control-section">
        <div class="section-label">FORWARD</div>
        <div class="forward-grid" id="forwardGrid">
            <button class="forward-option" data-distance="10">10</button>
            <button class="forward-option" data-distance="15">15</button>
            <button class="forward-option" data-distance="20">20</button>
            <button class="forward-option" data-distance="25">25</button>
            <button class="forward-option" data-distance="30">30</button>
            <button class="forward-option selected" data-distance="35">35</button>
            <button class="forward-option" data-distance="40">40</button>
            <button class="forward-option" data-distance="45">45</button>
            <button class="forward-option" data-distance="50">50</button>
            <button class="forward-option" data-distance="55">55</button>
            <button class="forward-option" data-distance="60">60</button>
            <button class="forward-option" data-distance="65">65</button>
        </div>
        <div class="range-note">FINER FORWARD CONTROL · 5-UNIT STEPS</div>
    </div>

    <button class="add-move" id="addMove">＋ ADD MOVE</button>
</div>

<div class="readouts">
        <div class="readout"><b>LAST MOVE</b><span id="lastMove">—</span></div>
        <div class="readout"><b>COMMANDS</b><span id="countReadout">0 / 40</span></div>
    </div>

    <div class="turns">
        
        <button class="btn grab" data-action="GRAB" type="button">GRIP / GRAB</button>
        <button class="btn drop" data-action="DROP" type="button">DROP</button>
    </div>

    <button class="exec" id="exec" type="button">▶ EXECUTE SEQUENCE</button>

    <div class="queue-title">
        <span>COMMAND BUFFER</span>
        <span id="count">0 / 40</span>
    </div>
    <div class="queue" id="queue">
        <span>SET ANGLE → SET FORWARD → ADD MOVE</span>
    </div>
    <div class="status-line" id="statusLine">READY</div>
</div>
</main>

<div class="overlay" id="overlay">
    <div class="modal">
        <h1 id="overlayTitle">MISSION COMPLETE</h1>
        <p id="overlayText">Round ended. Scan a new QR code when ready.</p>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
(()=> {
'use strict';

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const sessionId = (params.get('session') || '').trim().toUpperCase();
const socket = io({query:{session:sessionId}});
const queue = [];
let gameActive = false;
let executing = false;

function haptic(pattern = 25) {
    if (navigator.vibrate) navigator.vibrate(pattern);
}

function setControls(on) {
    document.querySelectorAll('button').forEach(b => b.disabled = !on);
}

function renderQueue() {
    $('count').textContent = `${queue.length} / 40`;
    $('countReadout').textContent = `${queue.length} / 40`;

    $('queue').innerHTML = queue.length
        ? queue.map((c,i) => {
            let label;

            if (c.action === 'MOVE') {
                label = `MOVE ${Math.round(c.angle)}° · ${Math.round(c.distance ?? 0)}`;
            } else if (c.action === 'GRAB') {
                label = 'GRIP';
            } else {
                label = 'DROP';
            }

            return `<button class="chip" type="button" data-remove="${i}" title="Remove command">${i+1}. ${label} ×</button>`;
        }).join('')
        : '<span>SET ANGLE → SET FORWARD → ADD MOVE</span>';
}

$('queue').addEventListener('click', e => {
    const b = e.target.closest('[data-remove]');
    if (!b || executing) return;

    const i = Number(b.dataset.remove);
    if (Number.isInteger(i)) {
        queue.splice(i, 1);
        renderQueue();
        $('statusLine').textContent = 'COMMAND REMOVED';
        haptic(15);
    }
});

function add(c) {
    if (!gameActive || executing || queue.length >= 40) return;

    queue.push(c);
    renderQueue();
    haptic();
    $('statusLine').textContent = 'COMMAND ADDED';
}

function pressButton(button) {
    button.classList.add('pressed');
    setTimeout(() => button.classList.remove('pressed'), 100);
}

/* Angle + forward movement controls */
let selectedAngle = 0;
let selectedDistance = 40;

document.querySelectorAll('.angle-option').forEach(button => {
    button.addEventListener('click', () => {
        if (!gameActive || executing) return;

        document.querySelectorAll('.angle-option').forEach(b => b.classList.remove('selected'));
        button.classList.add('selected');

        selectedAngle = Number(button.dataset.angle);
        $('selectedAngle').textContent = `${selectedAngle}°`;
        haptic(10);
    });
});

document.querySelectorAll('.forward-option').forEach(button => {
    button.addEventListener('click', () => {
        if (!gameActive || executing) return;

        document.querySelectorAll('.forward-option').forEach(b => b.classList.remove('selected'));
        button.classList.add('selected');

        selectedDistance = Number(button.dataset.distance);
        haptic(10);
    });
});

$('addMove').addEventListener('click', () => {
    if (!gameActive || executing) return;

    add({
        action: 'MOVE',
        distance: selectedDistance,
        angle: selectedAngle
    });

    $('lastMove').textContent = `${selectedAngle}° / ${selectedDistance}`;
    $('statusLine').textContent = `MOVE ${selectedAngle}° · ${selectedDistance}`;
    haptic(20);
});


document.querySelectorAll('[data-action]').forEach(b => {
    b.addEventListener('click', () => {
        if (!gameActive || executing) return;

        add({action:b.dataset.action});
        pressButton(b);
    });
});

$('clear').addEventListener('click', () => {
    if (executing) return;

    queue.length = 0;
    renderQueue();
    $('lastMove').textContent = '—';
    $('statusLine').textContent = 'BUFFER CLEARED';
    haptic(15);
});

$('exec').addEventListener('click', () => {
    if (!gameActive || executing || !queue.length) {
        if (!queue.length) $('statusLine').textContent = 'ADD COMMANDS FIRST';
        return;
    }

    executing = true;
    setControls(false);
    $('statusLine').textContent = 'EXECUTING...';

    socket.emit('controller_command', {
        action:'EXEC',
        queue:queue
    });

    haptic([35,40,80]);
});

function showOverlay(t,p) {
    $('overlayTitle').textContent = t;
    $('overlayText').textContent = p;
    $('overlay').classList.add('show');
}

function updateState(s) {
    if (!s) return;

    gameActive = s.phase === 'PLAYING';
    $('message').textContent = s.message || 'MISSION ACTIVE';

    const t = Math.max(0, Number(s.timeLeft) || 0);
    $('timer').textContent =
        `${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;

    setControls(gameActive && !executing);
}

socket.on('connect', () => {
    $('link').classList.add('online');
    $('linkText').textContent = 'CONNECTED';
    $('statusLine').textContent = 'WAITING FOR LAPTOP GAME...';

    socket.emit('register_role', {
        role:'controller',
        session:sessionId
    });
});

socket.on('player_linked', s => {
    gameActive = false;
    setControls(false);
    $('statusLine').textContent = 'PLAYER LINKED — WAIT FOR GO';
});

socket.on('countdown', d => {
    $('statusLine').textContent =
        d?.value === 'GO'
            ? 'GO! START MOVING'
            : 'STARTING IN ' + d.value;
});

socket.on('game_started', s => {
    $('overlay').classList.remove('show');
    queue.length = 0;
    executing = false;
    renderQueue();
    updateState(s);
    $('statusLine').textContent = 'CONTROLLER LINKED — GAME IS ON LAPTOP';
    haptic([30,30,70]);
});

socket.on('command_ack', c => {
    $('statusLine').textContent = `${c.action} READY`;
});

socket.on('command_error', e => {
    executing = false;
    setControls(false);
    $('statusLine').textContent = e.error || 'COMMAND ERROR';
});

socket.on('execution_result', r => {
    executing = false;
    setControls(false);

    if (r?.ok) {
        queue.length = 0;
        renderQueue();

        const failed = r.events?.find(e => e.success === false || e.message);
        $('statusLine').textContent =
            failed?.message || 'SEQUENCE COMPLETE';

        haptic(25);
    } else {
        $('statusLine').textContent =
            r?.error || 'SEQUENCE FAILED';
    }

    if (r?.state) updateState(r.state);
});

socket.on('timer_tick', d => {
    const t = Math.max(0, Number(d.timeLeft) || 0);

    $('timer').textContent =
        `${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;
});

socket.on('invalid_session', () => {
    gameActive = false;
    setControls(false);
    showOverlay('INVALID SESSION','Scan the current QR code.');
});

socket.on('game_full', () => {
    gameActive = false;
    setControls(false);
    showOverlay('ARCADE BUSY','Wait for the next QR code.');
});

socket.on('force_disconnect', d => {
    gameActive = false;
    executing = false;
    setControls(false);

    showOverlay(
        d?.reason === 'TIME UP' ? 'TIME UP' : 'MISSION COMPLETE',
        'Round ended. Scan the next QR code.'
    );
});

socket.on('connect_error', () => {
    $('link').classList.remove('online');
    $('linkText').textContent = 'RETRYING';
    $('statusLine').textContent = 'CANNOT REACH LAPTOP — USE SAME WI-FI';
});

socket.on('disconnect', () => {
    gameActive = false;
    executing = false;
    $('link').classList.remove('online');
    $('linkText').textContent = 'OFFLINE';
    $('statusLine').textContent = 'LAPTOP CONNECTION LOST';
    setControls(false);
});

renderQueue();
setControls(false);

})();
</script>
</body>
</html>
